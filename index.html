<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mutabaah Yaumiyah | Portal Ibadah</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } } }
  </script>
  <style>
    body { transition: background-color 0.25s ease, color 0.25s ease; -webkit-tap-highlight-color: transparent; }
    .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-top: 1px solid rgba(226, 232, 240, 0.8); }
    .dark .glass-nav { background: rgba(15, 23, 42, 0.85); border-top: 1px solid rgba(51, 65, 85, 0.6); }
    .modal-overlay { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
    .notif-badge { animation: pulse-badge 2s infinite; }
    @keyframes pulse-badge { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    @media print {
      body * { visibility: hidden; }
      header, nav, .no-print, #adminControls, #tabNavigations { display: none !important; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; padding: 10px; background: white; color: black; }
      .print-table { border-collapse: collapse; width: 100%; font-size: 9pt; }
      .print-table th, .print-table td { border: 1px solid #cbd5e1; padding: 6px; text-align: left; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-[#0b0f19] dark:text-slate-100 min-h-screen font-sans pb-24">

  <header class="bg-white dark:bg-[#0f172a] border-b border-slate-200 dark:border-slate-800 px-5 py-4 sticky top-0 z-40 flex justify-between items-center transition-colors">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-emerald-600 dark:bg-emerald-500/20 flex items-center justify-center text-white dark:text-emerald-400 font-bold shadow-sm">
        <i class="fa-solid fa-mosque text-sm"></i>
      </div>
      <div>
        <h1 class="text-base font-bold tracking-tight text-slate-900 dark:text-white leading-tight">Mutabaah Yaumiyah</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium" id="headerInfo">Sistem Monitoring Ibadah</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="notifBtn" onclick="openNotifModal()" aria-label="Notifikasi" class="hidden relative w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition flex items-center justify-center text-sm no-print">
        <i class="fa-solid fa-bell"></i>
        <span id="notifBadge" class="notif-badge hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center">1</span>
      </button>
      <button id="profileBtn" onclick="openProfileModal()" aria-label="Profil" class="hidden w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition flex items-center justify-center text-sm no-print" title="Profil Saya">
        <i class="fa-solid fa-user"></i>
      </button>
      <button onclick="toggleDarkMode()" aria-label="Ganti tema" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition flex items-center justify-center text-sm no-print">
        <i id="themeIcon" class="fa-solid fa-moon"></i>
      </button>
      <button id="logoutBtn" onclick="handleLogout()" aria-label="Keluar" class="hidden w-9 h-9 rounded-xl bg-rose-50 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 hover:bg-rose-100 transition flex items-center justify-center text-sm no-print" title="Keluar">
        <i class="fa-solid fa-power-off"></i>
      </button>
    </div>
  </header>

  <main id="view-login" class="p-5 flex flex-col items-center justify-center min-h-[80vh]">
    <div class="bg-white dark:bg-[#111827] p-8 rounded-2xl shadow-xl shadow-slate-200/50 dark:shadow-none w-full max-w-sm border border-slate-200/80 dark:border-slate-800">
      <div class="mb-6">
        <h2 class="text-xl font-bold text-slate-900 dark:text-white">Selamat Datang</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Masukkan kredensial akun untuk mengakses sistem</p>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1.5">Username / NISN</label>
          <input type="text" id="loginUser" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-medium transition" placeholder="Contoh: admin">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1.5">PIN Akses</label>
          <input type="password" id="loginPin" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-medium transition" placeholder="••••">
        </div>
        <button onclick="handleLogin()" id="btnMasuk" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-sm transition active:scale-[0.99] text-sm mt-2">
          Masuk ke Portal
        </button>
      </div>
    </div>
  </main>

  <main id="view-main" class="hidden p-4 max-w-lg mx-auto space-y-4">
    <!-- Formulir Mutabaah Content -->
    <div class="bg-white dark:bg-[#111827] p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
      <div class="flex justify-between items-center mb-2.5">
        <div class="text-xs font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 flex items-center gap-1.5">
          <i class="fa-solid fa-clock"></i> Jadwal Shalat
        </div>
      </div>
      <div id="prayerScheduleWidget" class="grid grid-cols-5 gap-1.5 text-center">
        <div class="p-2 rounded-xl bg-slate-50 dark:bg-slate-900 animate-pulse"><span class="block text-[10px] text-slate-400">Subuh</span><span class="text-xs font-bold">-:--</span></div>
        <div class="p-2 rounded-xl bg-slate-50 dark:bg-slate-900 animate-pulse"><span class="block text-[10px] text-slate-400">Dzuhur</span><span class="text-xs font-bold">-:--</span></div>
        <div class="p-2 rounded-xl bg-slate-50 dark:bg-slate-900 animate-pulse"><span class="block text-[10px] text-slate-400">Ashar</span><span class="text-xs font-bold">-:--</span></div>
        <div class="p-2 rounded-xl bg-slate-50 dark:bg-slate-900 animate-pulse"><span class="block text-[10px] text-slate-400">Maghrib</span><span class="text-xs font-bold">-:--</span></div>
        <div class="p-2 rounded-xl bg-slate-50 dark:bg-slate-900 animate-pulse"><span class="block text-[10px] text-slate-400">Isya</span><span class="text-xs font-bold">-:--</span></div>
      </div>
    </div>

    <div class="bg-white dark:bg-[#111827] p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center justify-between">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Tanggal Pengisian</label>
      </div>
      <input type="date" id="tglInput" class="p-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl text-sm font-semibold outline-none focus:ring-2 focus:ring-emerald-500">
    </div>

    <div id="formChecklist" class="space-y-2.5"></div>

    <div class="pt-2">
      <div class="bg-white dark:bg-[#111827] p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm mb-4">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Catatan Tambahan</label>
        <textarea id="catatanForm" rows="2" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Keterangan uzur atau kondisi khusus..."></textarea>
      </div>
      <button onclick="submitForm()" id="btnSubmitForm" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 rounded-xl shadow-sm transition active:scale-[0.99] text-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-paper-plane text-xs"></i> Simpan Mutabaah
      </button>
    </div>
  </main>

  <main id="view-dashboard" class="hidden p-4 max-w-5xl mx-auto space-y-4">
    <div class="bg-white dark:bg-[#111827] p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm text-center">
      <h3 class="text-lg font-bold">Dashboard Laporan</h3>
      <p class="text-xs text-slate-500 mt-2">Fitur laporan akan tampil di sini.</p>
    </div>
  </main>

  <nav id="bottomNav" class="hidden fixed bottom-0 w-full glass-nav z-50 no-print">
    <div class="flex justify-around items-center h-16 max-w-md mx-auto px-4">
      <button id="navFormBtn" onclick="switchView('Form')" class="flex flex-col items-center justify-center w-full h-full text-emerald-600 border-t-2 border-emerald-600 transition">
        <i class="fa-solid fa-pen-to-square text-lg mb-0.5"></i>
        <span class="text-[10px] font-bold tracking-wide">Formulir</span>
      </button>
      <button id="navDashBtn" onclick="switchView('Dash')" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
        <i class="fa-solid fa-chart-line text-lg mb-0.5"></i>
        <span class="text-[10px] font-bold tracking-wide">Laporan</span>
      </button>
    </div>
  </nav>

  <div id="toast" class="fixed top-16 right-4 p-3.5 rounded-xl shadow-lg text-white font-semibold text-xs transition-all duration-300 transform translate-x-10 opacity-0 pointer-events-none z-[100] flex items-center gap-2.5"></div>

  <script>
    // ============================================================
    // KONFIGURASI GOOGLE APPS SCRIPT (GANTI URL DI BAWAH INI)
    // ============================================================
    // PASTE URL WEB APP DARI CODE.GS ANDA DI SINI (Yang berakhiran /exec)
    const GAS_URL = 'https://script.google.com/macros/s/AKfycby.../exec'; 

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function buildParams(fn, args) {
      switch (fn) {
        case 'verifyLogin': return { user: args[0], pin: args[1] };
        case 'submitMutabaah': return { payload: args[0] };
        case 'getMutabaahEntry': return { nama: args[0], tanggal: args[1], role: args[2] };
        case 'getPersonalHistory': return { nama: args[0], role: args[1] };
        case 'getPrayerTimes': return { city: args[0], country: args[1] };
        default: return {};
      }
    }

    // Fungsi Fetch ke GAS (Disesuaikan agar tidak kena CORS)
    async function gsRun(fn, ...args) {
      const params = buildParams(fn, args);
      const res = await fetch(GAS_URL, {
        method: 'POST',
        // text/plain wajib agar browser tidak melakukan preflight OPTIONS request
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: fn, params })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    let appState = {
      userRole: null, userName: null, username: null,
      gender: 'L', isHaid: false
    };

    window.onload = function () {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
        $('themeIcon').className = 'fa-solid fa-sun';
      }
      fetchPrayerTimes();
    };

    async function fetchPrayerTimes() {
      const widget = $('prayerScheduleWidget');
      if (!widget) return;
      try {
        const res = await gsRun('getPrayerTimes', 'Jakarta', 'Indonesia');
        if (res && res.success && res.timings) {
          const t = res.timings;
          const items = [['Subuh',t.Fajr],['Dzuhur',t.Dhuhr],['Ashar',t.Asr],['Maghrib',t.Maghrib],['Isya',t.Isha]];
          widget.innerHTML = items.map(([label,time]) => `<div class="p-2 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-100 dark:border-slate-800"><span class="block text-[10px] text-slate-400 font-medium">${esc(label)}</span><span class="text-xs font-bold text-slate-700 dark:text-slate-200">${esc(time)}</span></div>`).join('');
        }
      } catch (e) { widget.innerHTML = 'Jadwal tidak tersedia'; }
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark'); localStorage.setItem('theme', 'light');
        $('themeIcon').className = 'fa-solid fa-moon';
      } else {
        html.classList.add('dark'); localStorage.setItem('theme', 'dark');
        $('themeIcon').className = 'fa-solid fa-sun';
      }
    }

    function showToast(msg, type = 'success') {
      const toast = $('toast');
      if (!toast) return;
      toast.innerHTML = `<span>${esc(msg)}</span>`;
      toast.className = `fixed top-16 right-4 p-3.5 rounded-xl shadow-xl text-white font-semibold text-xs transition-all duration-300 transform z-[100] flex items-center gap-2.5 ${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`;
      toast.classList.remove('translate-x-10', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-x-10', 'opacity-0'), 3500);
    }

    async function handleLogin() {
      const user = $('loginUser').value.trim();
      const pin = $('loginPin').value.trim();
      if (!user || !pin) return showToast('Username dan PIN wajib diisi!', 'error');
      const btn = $('btnMasuk');
      btn.innerHTML = 'Memverifikasi...';
      try {
        const res = await gsRun('verifyLogin', user, pin);
        if (res && res.success) {
          appState.userRole = res.role; appState.userName = res.nama;
          appState.username = res.username || res.nama;
          appState.gender = res.gender || 'L';
          showToast(`Selamat datang, ${res.nama}`);
          loginSuccessSetup();
        } else showToast((res && res.message) || 'Login gagal', 'error');
      } catch (e) { showToast('Gagal terhubung ke server.', 'error'); }
      finally { btn.innerHTML = 'Masuk ke Portal'; }
    }

    function loginSuccessSetup() {
      $('headerInfo').innerText = `${appState.userName} (${appState.userRole.toUpperCase()})`;
      $('view-login').classList.add('hidden');
      $('logoutBtn').classList.remove('hidden');
      $('bottomNav').classList.remove('hidden');
      $('tglInput').value = new Date().toISOString().split('T')[0];
      switchView('Form');
    }

    function handleLogout() {
      appState = { userRole: null, userName: null, username: null, gender: 'L', isHaid: false };
      $('view-login').classList.remove('hidden');
      $('view-main').classList.add('hidden');
      $('view-dashboard').classList.add('hidden');
      $('logoutBtn').classList.add('hidden');
      $('bottomNav').classList.add('hidden');
      $('loginUser').value = ''; $('loginPin').value = '';
      showToast('Anda telah keluar.');
    }

    function switchView(target) {
      $('view-main').classList.add('hidden'); $('view-dashboard').classList.add('hidden');
      if (target === 'Form') $('view-main').classList.remove('hidden');
      else $('view-dashboard').classList.remove('hidden');
    }

    function renderFormInputs() {
      const container = $('formChecklist'); if (!container) return;
      const isStaff = ['guru','wali','musyrif','admin'].includes(appState.userRole);
      const shalatBox = `
        <div class="bg-white dark:bg-[#111827] p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm mb-3">
          <div class="text-[11px] font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 mb-3 flex items-center gap-1.5">
            <i class="fa-solid fa-mosque"></i> Shalat Fardhu 5 Waktu
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-5 gap-2">
            ${['Shubuh','Dzuhur','Ashar','Maghrib','Isya'].map(s => `
              <div class="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-100 dark:border-slate-800">
                <span class="text-xs font-semibold text-slate-700 dark:text-slate-200">${s}</span>
                <input type="checkbox" id="f_${s.toLowerCase()}" class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500">
              </div>
            `).join('')}
          </div>
        </div>`;
      const otherList = isStaff ? ['Dzikir', 'Tilawah 2 Lembar', 'Bahan Ajar'] : ['Bantu Ortu', 'Bijak HP', 'Belajar', 'Tidur Awal', 'Tilawah'];
      container.innerHTML = shalatBox + `<div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 px-1 mb-1.5">Amalan Lainnya</div>` + 
        otherList.map(s => `
          <div class="flex items-center justify-between p-3.5 bg-white dark:bg-[#111827] rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
            <span class="text-xs font-semibold text-slate-700 dark:text-slate-200">${s}</span>
            <input type="checkbox" id="f_${s.replace(/\s/g,'')}" class="w-5 h-5 text-emerald-600 rounded focus:ring-emerald-500">
          </div>
        `).join('');
    }

    async function submitForm() {
      const btn = $('btnSubmitForm'); btn.innerHTML = 'Menyimpan...'; btn.disabled = true;
      const get = id => $(id) && $(id).checked ? 'Ya' : 'Tidak';
      const isStaff = ['guru','wali','musyrif','admin'].includes(appState.userRole);
      const payload = {
        role: appState.userRole, nama: appState.userName, tanggal: $('tglInput').value,
        catatan: $('catatanForm').value, isHaid: 'Tidak',
        shubuh: get('f_shubuh'), dzuhur: get('f_dzuhur'), ashar: get('f_ashar'), maghrib: get('f_maghrib'), isya: get('f_isya')
      };
      if (isStaff) {
        payload.dzikir = get('f_Dzikir');
        payload.tilawah_2lbr = get('f_Tilawah2Lembar');
        payload.bahan_ajar = get('f_BahanAjar');
      } else {
        payload.kelas = '7.1'; payload.totalPoin = 50;
        payload.bantuOrtu = get('f_BantuOrtu'); payload.bijakHP = get('f_BijakHP');
        payload.belajar = get('f_Belajar'); payload.tidur = get('f_TidurAwal'); payload.tilawah = get('f_Tilawah');
      }
      try {
        const res = await gsRun('submitMutabaah', payload);
        if (res && res.success) showToast('Berhasil disimpan!');
        else showToast('Gagal menyimpan', 'error');
      } catch (e) { showToast('Error koneksi', 'error'); }
      finally { btn.innerHTML = 'Simpan Mutabaah'; btn.disabled = false; }
    }
  </script>
</body>
</html>
